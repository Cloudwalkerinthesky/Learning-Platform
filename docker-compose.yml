version: '3'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: db_user
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:6.2
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:2.0.3
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SERVICE_DB_NAME: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"

  rabbitmq:
    image: rabbitmq:3.9-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  user-service:
    build: ./user-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - NACOS_HOST=nacos
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql
      - redis
      - nacos
      - rabbitmq

  course-service:
    build: ./course-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - NACOS_HOST=nacos
      - RABBITMQ_HOST=rabbitmq
      - MINIO_HOST=minio
    depends_on:
      - mysql
      - redis
      - nacos
      - rabbitmq
      - minio

  learning-service:
    build: ./learning-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - NACOS_HOST=nacos
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql
      - redis
      - nacos
      - rabbitmq

  comment-service:
    build: ./comment-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - NACOS_HOST=nacos
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql
      - redis
      - nacos
      - rabbitmq

  api-gateway:
    build: ./api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_HOST=nacos
    ports:
      - "8080:8080"
    depends_on:
      - nacos

volumes:
  mysql-data:
  redis-data:
  minio-data: 